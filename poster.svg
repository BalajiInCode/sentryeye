<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1933" />
      <stop offset="60%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#cyberGrid)" />

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <path d="M 1240 70 L 1240 40 L 1210 40" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <path d="M 40 650 L 40 680 L 70 680" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <path d="M 1240 650 L 1240 680 L 1210 680" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>

  <!-- Top Status Bar -->
  <g transform="translate(60, 65)">
    <circle cx="10" cy="10" r="5" fill="#ef4444" />
    <text x="25" y="15" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SENTRYEYE // CONCEPT AD ARCHIVE</text>
    <text x="1100" y="15" text-anchor="end" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="1">720p HD • VOICE NARRATION</text>
  </g>

  <!-- Center CCTV Lens Graphic & Reticle -->
  <g transform="translate(640, 330)">
    <!-- Outer dashed circle -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-dasharray="6 6" />
    <!-- Secondary circle -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="rgba(20, 184, 166, 0.35)" stroke-width="1" />
    
    <!-- LED Ring Points -->
    <circle cx="0" cy="-115" r="3.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="81" cy="-81" r="3.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="115" cy="0" r="3.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="81" cy="81" r="3.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="0" cy="115" r="3.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="-81" cy="81" r="3.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="-115" cy="0" r="3.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="-81" cy="-81" r="3.5" fill="#00f0ff" filter="url(#glowCyan)"/>

    <!-- Inner Core & Play Icon -->
    <circle cx="0" cy="0" r="75" fill="#081326" stroke="#00f0ff" stroke-width="2" filter="url(#glowCyan)"/>
    
    <!-- Play Triangle -->
    <polygon points="-12,-22 24,0 -12,22" fill="#00f0ff" />
  </g>

  <!-- Title & Description -->
  <text x="640" y="525" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">Sentry<tspan fill="#00f0ff">Eye</tspan> — Official Concept Video</text>
  <text x="640" y="565" text-anchor="middle" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="16" letter-spacing="0.5">"A camera that doesn't just watch. It thinks."</text>
  <text x="640" y="605" text-anchor="middle" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="13" opacity="0.8">CLICK PLAY TO BEGIN WALKTHROUGH WITH AUDIO</text>
</svg>
